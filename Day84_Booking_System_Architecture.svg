<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <filter id="turbulence">
      <feTurbulence baseFrequency="0.02" numOctaves="3" result="noise" seed="1" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5" />
    </filter>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Bradley+Hand&display=swap');
      .sketch-text { font-family: Bradley Hand, Comic Sans MS, cursive; font-size: 16px; fill: #1a1a1a; }
      .title-text { font-family: Bradley Hand, Comic Sans MS, cursive; font-size: 28px; font-weight: bold; fill: #1a1a1a; }
      .label { font-family: Bradley Hand, Comic Sans MS, cursive; font-size: 14px; fill: #333; }
      .sketch-box { fill: #fefefe; stroke: #2c3e50; stroke-width: 2; filter: url(#turbulence); }
      .sketch-circle { fill: #fefefe; stroke: #2c3e50; stroke-width: 2; filter: url(#turbulence); }
      .sketch-line { stroke: #34495e; stroke-width: 2; fill: none; filter: url(#turbulence); }
      .section-1 { fill: #e8f4f8; opacity: 0.3; }
      .section-2 { fill: #f0e8f8; opacity: 0.3; }
      .section-3 { fill: #f8f4e8; opacity: 0.3; }
      .arrow { stroke: #2c3e50; stroke-width: 2; fill: none; marker-end: url(#arrowhead); filter: url(#turbulence); }
      .critical { fill: #ffebee; opacity: 0.4; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#2c3e50" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" class="title-text">High-Scale Booking System Architecture</text>
  <text x="600" y="65" text-anchor="middle" class="label">(Preventing Double-Booking Under Concurrency)</text>

  <!-- Section backgrounds -->
  <rect x="20" y="100" width="1160" height="780" class="section-1" rx="10"/>
  
  <!-- Layer 1: Users -->
  <rect x="50" y="120" width="1100" height="60" class="sketch-box" rx="5"/>
  <text x="600" y="155" text-anchor="middle" class="sketch-text">MILLIONS OF USERS</text>

  <!-- Arrow down -->
  <path d="M 600 180 L 600 220" class="arrow"/>

  <!-- Layer 2: Load Balancer -->
  <rect x="450" y="220" width="300" height="70" class="sketch-box" rx="5" stroke="#e74c3c" stroke-width="2.5"/>
  <text x="600" y="245" text-anchor="middle" class="sketch-text" fill="#c0392b">⚖️ LOAD BALANCER</text>
  <text x="600" y="265" text-anchor="middle" class="label">Distribute traffic</text>
  <text x="600" y="280" text-anchor="middle" class="label">across servers</text>

  <!-- Arrow down -->
  <path d="M 600 290 L 600 330" class="arrow"/>

  <!-- Layer 3: Rate Limiter -->
  <rect x="450" y="330" width="300" height="70" class="sketch-box" rx="5" stroke="#f39c12" stroke-width="2.5"/>
  <text x="600" y="355" text-anchor="middle" class="sketch-text" fill="#d68910">🚦 RATE LIMITER</text>
  <text x="600" y="375" text-anchor="middle" class="label">Protect downstream</text>
  <text x="600" y="390" text-anchor="middle" class="label">from overload</text>

  <!-- Arrow down -->
  <path d="M 600 400 L 600 440" class="arrow"/>

  <!-- Layer 4: Queue -->
  <rect x="450" y="440" width="300" height="70" class="sketch-box" rx="5" stroke="#9b59b6" stroke-width="2.5"/>
  <text x="600" y="465" text-anchor="middle" class="sketch-text" fill="#8e44ad">📬 QUEUE</text>
  <text x="600" y="485" text-anchor="middle" class="label">Absorb traffic spikes</text>
  <text x="600" y="500" text-anchor="middle" class="label">(Kafka/RabbitMQ)</text>

  <!-- Arrow down -->
  <path d="M 600 510 L 600 550" class="arrow"/>

  <!-- Layer 5: Booking Service -->
  <rect x="400" y="550" width="400" height="80" class="sketch-box" rx="5" stroke="#27ae60" stroke-width="2.5"/>
  <text x="600" y="580" text-anchor="middle" class="sketch-text" fill="#229954">🎫 BOOKING SERVICE</text>
  <text x="600" y="600" text-anchor="middle" class="label">Idempotency Check</text>
  <text x="600" y="615" text-anchor="middle" class="label">↓ Redis atomic claim ↓ Database persist</text>

  <!-- Arrow splits left and right -->
  <path d="M 500 630 L 350 670" class="arrow"/>
  <path d="M 700 630 L 850 670" class="arrow"/>

  <!-- Layer 6: Redis (left side, critical) -->
  <rect x="220" y="670" width="260" height="100" class="sketch-box critical" rx="5" stroke="#c0392b" stroke-width="2.5"/>
  <text x="350" y="700" text-anchor="middle" class="sketch-text" fill="#c0392b">⚡ REDIS</text>
  <text x="350" y="720" text-anchor="middle" class="label">SET seat:42</text>
  <text x="350" y="735" text-anchor="middle" class="label">NX EX 300</text>
  <text x="350" y="750" text-anchor="middle" class="label">(Atomic Claim)</text>

  <!-- Layer 7: Database (right side, critical) -->
  <rect x="720" y="670" width="260" height="100" class="sketch-box critical" rx="5" stroke="#c0392b" stroke-width="2.5"/>
  <text x="850" y="700" text-anchor="middle" class="sketch-text" fill="#c0392b">🗄️ DATABASE</text>
  <text x="850" y="720" text-anchor="middle" class="label">INSERT booking</text>
  <text x="850" y="735" text-anchor="middle" class="label">UNIQUE constraint</text>
  <text x="850" y="750" text-anchor="middle" class="label">(Durable Truth)</text>

  <!-- Arrow down from both -->
  <path d="M 350 770 L 350 810" class="arrow"/>
  <path d="M 850 770 L 850 810" class="arrow"/>

  <!-- Converge -->
  <path d="M 350 810 L 600 810 L 850 810" class="arrow"/>

  <!-- Bottom: Waitlist -->
  <circle cx="600" cy="840" r="40" class="sketch-circle" stroke="#3498db" stroke-width="2.5"/>
  <text x="600" y="835" text-anchor="middle" class="sketch-text" fill="#2980b9">📋 WAITLIST</text>
  <text x="600" y="850" text-anchor="middle" class="label">(Sold Out)</text>

  <!-- Key decision boxes (annotations) -->
  <g opacity="0.9">
    <rect x="1000" y="220" width="160" height="100" class="sketch-box" rx="5" stroke="#7f8c8d"/>
    <text x="1080" y="245" text-anchor="middle" class="label" font-size="13" font-weight="bold">KEY DECISIONS</text>
    <text x="1080" y="265" text-anchor="middle" class="label" font-size="12">✓ Redis ≠ DB</text>
    <text x="1080" y="280" text-anchor="middle" class="label" font-size="12">✓ Idempotency</text>
    <text x="1080" y="295" text-anchor="middle" class="label" font-size="12">✓ TTL expiry</text>
    <text x="1080" y="310" text-anchor="middle" class="label" font-size="12">✓ DB constraint</text>
  </g>

  <!-- Hand-drawn checkboxes -->
  <g opacity="0.8">
    <rect x="1000" y="400" width="160" height="140" class="sketch-box" rx="5" stroke="#7f8c8d"/>
    <text x="1080" y="425" text-anchor="middle" class="label" font-size="13" font-weight="bold">ARCH PRINCIPLES</text>
    <circle cx="1015" cy="445" r="4" fill="none" stroke="#7f8c8d" stroke-width="1.5"/>
    <text x="1030" y="450" class="label" font-size="11">Scalability</text>
    
    <circle cx="1015" cy="470" r="4" fill="none" stroke="#7f8c8d" stroke-width="1.5"/>
    <text x="1030" y="475" class="label" font-size="11">Concurrency</text>
    
    <circle cx="1015" cy="495" r="4" fill="none" stroke="#7f8c8d" stroke-width="1.5"/>
    <text x="1030" y="500" class="label" font-size="11">Reliability</text>
    
    <circle cx="1015" cy="520" r="4" fill="none" stroke="#7f8c8d" stroke-width="1.5"/>
    <text x="1030" y="525" class="label" font-size="11">Defense-in-depth</text>
  </g>

</svg>
